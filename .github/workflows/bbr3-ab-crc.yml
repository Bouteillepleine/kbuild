name: 🔬 BBR3 A/B CRC (same-hash, drift-free)

# Builds OP15 bbr3=true AND bbr3=false from the SAME resolved SukiSU/susfs hash
# (pinned once, so the 700-CRC per-build churn cancels out), then diffs
# Module.symvers. The only difference between the two kernels is BBRv3 itself,
# so any change to tcp_cong_avoid_ai / tcp_slow_start is caused by BBRv3.

on:
  workflow_dispatch:
  push:
    branches: [bbr3-test, test]
    paths: ['.github/workflows/bbr3-ab-crc.yml']

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ksu: ${{ steps.r.outputs.ksu }}
      susfs: ${{ steps.r.outputs.susfs }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          db=$(gh api repos/ReSukiSU/ReSukiSU --jq .default_branch)
          ksu=$(gh api "repos/ReSukiSU/ReSukiSU/commits/$db" --jq .sha)
          susfs=$(curl -s "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/branches/gki-android16-6.12" \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['commit']['id'])")
          echo "ksu=$ksu"     >> "$GITHUB_OUTPUT"
          echo "susfs=$susfs" >> "$GITHUB_OUTPUT"
          echo "PINNED  ksu=$ksu  susfs=$susfs"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bbr3: ["true", "false"]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        uses: ./.github/actions/disk-cleanup
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
      - name: Configure ccache env (action references these under set -u)
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache"   >> "$GITHUB_ENV"
          echo "LDCACHE_DIR=${{ github.workspace }}/.ld_cache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=12G"                            >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.ccache" "${{ github.workspace }}/.ld_cache"
      - name: Compose op_config_json (bbr3=${{ matrix.bbr3 }})
        id: cfg
        run: |
          cat > base.json <<'JSON'
          {"model":"OP15","soc":"canoe","branch":"wild/sm8850","manifest":"oneplus_15_w.xml","android_version":"android16","kernel_version":"6.12","os_version":"A16","lto":"none","zyc_compiler":"","c_compiler":"kernel_platform/prebuilts/clang/host/linux-x86/clang-r547379/bin","rust_compiler":"kernel_platform/prebuilts/rust/linux-x86/1.82.0/bin","bindgen":"","rust_build":true,"disk_cleanup":true,"hmbird":false,"susfs":true,"opt":false,"ds":false,"bbg":false,"bbr":true,"bbr3":true,"ttl":true,"ip_set":true,"unicode":true,"ntsync":false,"blacklist_modules":"kernelsu,oplus_security_guard,oplus_qr_scan,oplus_score,oplus_vip_task,oplus_dns_cache,oplus_network_linkpower_module,oplus_data_module,oplus_secure_harden,oplus_security_keventupload,oplus_secure_guard_new,oplus_secure_guard,coresight_tpda,coresight_tgu,coresight_trace_noc,coresight_cti,coresight_qmi,coresight_dummy,coresight_remote_etm,coresight_tpdm,coresight_uetm,coresight_stm,coresight_tmc_sec,f_fs_ipc_log,qti_battery_debug,rdbg,stm_heartbeat,stm_p_ost,stm_core,stm_ftrace,stm_console,spmi_pmic_arb_debug","uname":"5-gb2a876903b49-ab14541642-4k"}
          JSON
          json=$(jq -c --argjson b ${{ matrix.bbr3 }} '.bbr3 = $b' base.json)
          echo "config_json=$json" >> "$GITHUB_OUTPUT"
      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.cfg.outputs.config_json }}
          ksu_type: RSKSU
          ksu_branch_or_hash: ${{ needs.resolve.outputs.ksu }}
          susfs_commit_hash_or_branch: ${{ needs.resolve.outputs.susfs }}
          optimize_level: O2
          build_timestamp: "Tue Feb 10 10:01:02 UTC 2026"
          clean: true
          debug: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Grab Module.symvers
        if: always()
        run: |
          # debug build copies it to DEBUG_ARTIFACTS_FOLDER; also search the tree.
          f=$(find "${DEBUG_ARTIFACTS_FOLDER:-/nonexistent}" "${COMMON_KERNEL_FOLDER:-/nonexistent}" "$GITHUB_WORKSPACE" -name Module.symvers 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "::error::Module.symvers not found"; exit 1; }
          echo "found: $f ($(wc -l < "$f") symbols)"
          mkdir -p sv && cp "$f" sv/Module.symvers
      - name: Upload symvers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symvers-bbr3-${{ matrix.bbr3 }}
          path: sv/Module.symvers
          if-no-files-found: ignore

  compare:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: symvers-bbr3-*
          path: dl
      - name: Diff CRCs (bbr3 vs no-bbr3, same hash)
        run: |
          set -e
          on=$(find dl -path '*true*'  -name Module.symvers | head -1)
          off=$(find dl -path '*false*' -name Module.symvers | head -1)
          [ -n "$on" ] && [ -n "$off" ] || { echo "::error::missing symvers (on='$on' off='$off') — a build likely failed for real"; exit 1; }
          echo "on(bbr3)=$on  off(no-bbr3)=$off"
          awk -F'\t' 'NF>=2{print $2"\t"$1}' "$on"  | sort -u > on.map
          awk -F'\t' 'NF>=2{print $2"\t"$1}' "$off" | sort -u > off.map
          join -t"$(printf '\t')" on.map off.map | awk -F'\t' '$2!=$3{print $1"  "$3" -> "$2}' > changed.txt
          N=$(wc -l < changed.txt)
          {
            echo "## BBR3 vs no-BBR3 — SAME resolved hash (drift-free)"
            echo ""
            echo "**Total CRC changes attributable to BBRv3: $N**"
            echo ""
            echo "### The two symbols oplus_network_tuning depends on"
            echo '```'
            grep -E '^(tcp_cong_avoid_ai|tcp_slow_start)' changed.txt || echo "(unchanged — BBRv3 is CRC-neutral on tcp_sock ✅)"
            echo '```'
            echo ""
            if [ "$N" -eq 0 ]; then
              echo "✅ VERDICT: BBRv3 changes ZERO CRCs. oplus_network_tuning loads in recovery — fix complete."
            elif grep -qE '^(tcp_cong_avoid_ai|tcp_slow_start)' changed.txt; then
              echo "⚠️ VERDICT: tcp_sock-referencing CRC still shifts (rate_sample ripple) — needs v5 (fields -> bbr3 ctx)."
              echo ""
              echo "### All changed symbols"
              echo '```'; cat changed.txt; echo '```'
            else
              echo "✅ VERDICT: tcp_cong_avoid_ai/tcp_slow_start unchanged; other deltas are incidental."
              echo ""
              echo "### Other changed symbols ($N)"
              echo '```'; head -60 changed.txt; echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bbr3-ab-crc-diff
          path: changed.txt
