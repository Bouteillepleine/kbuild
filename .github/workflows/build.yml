name: Build

# Scoped to this branch only: kbuild holds several unrelated branches and none
# of them should trigger an Android build. workflow_dispatch alone does not work
# here because the file is not on the default branch, so GitHub cannot see it.
on:
  push:
    branches: [cc-qs-tiles]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cc-qs-tiles
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
